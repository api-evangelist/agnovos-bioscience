aid: agnovos-bioscience
name: AgNovos Bioscience
description: 'AgNovos Bioscience is a privately held medical technology company developing
  novel treatments for bone disease, founded in 2012 with offices in New York, Rockville
  (Maryland), Frankfurt and Dallas. Its lead technology is AGN1, a proprietary triphasic,
  calcium-based, osteoconductive implant material delivered through the OSSURE Local
  Osteo-Enhancement Procedure (LOEP) — a minimally invasive procedure intended to
  immediately, substantially and durably increase the density and strength of osteoporotic
  bone at sites of highest fracture risk. The company runs an active clinical program
  (CONFIRM, RECONFIRM, RESTORE and GRACE trials) and sponsors the ESCEO-AgNovos Young
  Investigator Award. AgNovos ships a physical implant and surgical kit, not software:
  its public web presence is a corporate and clinical-communications site with no
  developer program, no public API, and no machine-readable interface of any kind.'
